<script>
    async function init() {
        const res = await fetch('/api/v1');
        if (!res.ok) throw new Error('API offline');
        const json = await res.json();
        document.getElementById('stats').textContent = `${json.count} entries loaded`;

        function createChart(id, label, color) {
            return new Chart(document.getElementById(id), {
                type: 'line', data:{labels:[{label:'X'}{label:'Y'}], datasets:[{label, borderColor, tension:0.3}]}, options:{responsive:true}});
        }

        const bp = createChart('bp','Blood Pressure',['red','#2196F3']);
        const hr = createChart('hr','Heart Rate',['#4caf50']);
        const wt = createChart('wt','Weight',['orange']);

        let n=json.data.length;
        if (n>0) {
            bp.data.labels=[{label:'X'},...Array(n).keys()].map((i,k)=>new Date(json.data[k].timestamp).toLocaleTimeString());
            hr.data.labels=[{label:'X'},...Array(n).keys()]; hr.data.datasets[0]=new ChartDataset({label,'Heart Rate',backgroundColor:color},{data:json.data.map(d=>d.heart_rate)})];
            wt.data.labels=[[{label:'X'},...Array(n).keys()]]; wt.data.datasets[0]=new ChartDataset({label,'Weight','borderColor':color,...},{data:json.data.map(d=>d.weight)}]);
        }
        bp.update(); hr.update(); wt.update();
    }
    init().catch(()=>{document.getElementById('stats').innerHTML='API offline (403/500)';});
</script>
