parameters:
    # ── Build-time fallbacks (GUIDING-LIGHT §8.12) ──────────────────────────
    # Not secrets, and not runtime defaults to *rely* on — they exist so that
    # `composer run-script post-install-cmd` (cache:clear) can compile the prod
    # container during `docker build`.
    #
    # The build has no environment to resolve from: `.env` is deliberately
    # excluded from the build context (§6.1 — it must never reach a layer), so
    # dotenv has nothing to read, and any `resolve:` lookup with no variable and
    # no declared fallback aborts the build with
    # `Environment variable not found: "DATABASE_URL"`.
    #
    # Exactly these two are needed at compile time. APP_SECRET and API_KEY
    # deliberately get NO fallback: neither is resolved while compiling, and a
    # placeholder secret is how a real one gets silently shadowed at runtime.
    #
    # A value injected at runtime always wins over these — this is a default,
    # not an override, and that ordering is what makes the image safe to ship.
    env(DATABASE_URL): 'sqlite:///%kernel.project_dir%/var/data/health_tracker.db'
    env(DEFAULT_URI): 'http://localhost'

    env(READ_ONLY_API_KEY): ''

    app.api_key: '%env(resolve:API_KEY)%'
    # Optional read-only API key. When set, this key can access GET/HEAD
    # endpoints under /api/v1 but cannot create, update, or delete data.
    # Leave empty/unset to disable (single-admin-key mode).
    app.read_only_api_key: '%env(resolve:READ_ONLY_API_KEY)%'

    # Deployment-wide default for the dashboard reading-entry warnings
    # (high/normal/etc. hints shown while typing a new reading).
    # Defaults to 1 (enabled) — non-breaking. Users can still toggle per
    # browser; the browser preference overrides this default.
    env(READING_WARNINGS_ENABLED): '1'
    app.reading_warnings_enabled: '%env(bool:READING_WARNINGS_ENABLED)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Override ApiKeySubscriber to inject the API key parameters explicitly
    App\Security\ApiKeySubscriber:
        arguments:
            $apiKey: '%app.api_key%'
            $readOnlyApiKey: '%app.read_only_api_key%'
