parameters:
    env(READ_ONLY_API_KEY): ''

    app.api_key: '%env(resolve:API_KEY)%'
    # Optional read-only API key. When set, this key can access GET/HEAD
    # endpoints under /api/v1 but cannot create, update, or delete data.
    # Leave empty/unset to disable (single-admin-key mode).
    app.read_only_api_key: '%env(resolve:READ_ONLY_API_KEY)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Override ApiKeySubscriber to inject the API key parameters explicitly
    App\Security\ApiKeySubscriber:
        arguments:
            $apiKey: '%app.api_key%'
            $readOnlyApiKey: '%app.read_only_api_key%'
