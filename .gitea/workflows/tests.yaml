name: Tests

on:
  push:
    branches:
      - 'main'
      - 'feat*'
      - 'fix*'
      - 'cleanup*'
      - 'chore*'
  pull_request_target:
    branches:
      - 'main'

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, dom, filter, json, mbstring, xmlwriter, libxml, pdo, pdo_sqlite
          coverage: none

      # Authenticate to GitHub to raise API rate limit from 60 → 5,000 req/hour.
      # Composer downloads packages from api.github.com; without auth, the 105
      # GitHub-hosted packages in composer.lock exceed the 60 req/hour limit.
      - name: Configure GitHub OAuth token
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_GITHUB_TOKEN }}
        run: composer config --global github-oauth.github.com "$GITHUB_TOKEN"

      # Cache Composer's download cache so repeated CI runs don't re-download
      # packages at all. Keyed on composer.lock hash — cache busts automatically
      # when dependencies change.
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Copy environment file
        run: cp .env.test .env

      # Ensure var/data/ exists for SQLite — the directory is tracked via
      # .gitkeep but this is a belt-and-suspenders safeguard.
      - name: Create data directory
        run: mkdir -p var/data

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run tests
        run: vendor/bin/phpunit --configuration phpunit.dist.xml
