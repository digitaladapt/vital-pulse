# The 'public' network must be created before first run:
#   docker network create public
# This shared network allows the reverse proxy to reach this service.
networks:
  public:
    external: true

services:
  vital-pulse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: vital-pulse
    ports:
      - "${VITALPULSE_PORT:-8080}:80"
    environment:
      APP_SECRET: ${APP_SECRET:-}
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data/health_tracker.db"
      API_KEY: ${API_KEY:-change-me}
      DEFAULT_URI: ${DEFAULT_URI:-https://vitals.devgnome.com}
    restart: unless-stopped
    networks:
      - public
    volumes:
      - ./var/data:/app/var/data
